moex:
  ticker: OZON
  default_start_date: "2023-10-01" # Дата для первого запуска
  end_date: "2026-03-31" # Максимальная дата (если None, то берется today)

cbr:
  default_start_date: "2023-10-01"
  currency_date_req: "31/03/2026" # Для курсов валют (или можно брать today)

database:
  host: localhost
  port: 5432
  name: ozon_analytics
  user: postgres
  password: postgres

retry:
  max_attempts: 5
  wait_seconds: 5